```yaml
domain_entities:
  - name: ServiceEndpoint
    fields:
      - name: id
        type: UUID
      - name: url
        type: URL
      - name: timeout
        type: Duration
      - name: retry_attempts
        type: Integer
      - name: status
        type: Enum[ACTIVE, INACTIVE, ERROR]
  - name: RequestContext
    fields:
      - name: request_id
        type: UUID
      - name: timestamp
        type: DateTime
      - name: method
        type: HttpMethod
      - name: path
        type: Path
      - name: headers
        type: Map[String, String]
      - name: body
        type: Bytes
  - name: ResponseContext
    fields:
      - name: request_id
        type: UUID
      - name: status_code
        type: Integer
      - name: headers
        type: Map[String, String]
      - name: body
        type: Bytes
      - name: latency_ms
        type: Integer
  - name: WebhookSubscription
    fields:
      - name: id
        type: UUID
      - name: target_url
        type: URL
      - name: event_types
        type: List[String]
      - name: secret
        type: String
      - name: active
        type: Boolean
  - name: ProxyConfiguration
    fields:
      - name: id
        type: UUID
      - name: upstream_service_id
        type: UUID
      - name: route_pattern
        type: PathPattern
      - name: middleware_rules
        type: List[String]
      - name: rate_limit
        type: Integer

functional_operations:
  - action: forward_request
    inputs:
      - name: context
        type: RequestContext
      - name: service_endpoint
        type: ServiceEndpoint
    outputs:
      - name: response
        type: ResponseContext
    invariants:
      - request_id_must_be_unique
      - timeout_must_not_exceed_service_limit
      - valid_http_method_required
  - action: process_webhook
    inputs:
      - name: event_data
        type: Map[String, Any]
      - name: subscription
        type: WebhookSubscription
    outputs:
      - name: delivery_result
        type: Boolean
    invariants:
      - valid_event_type_required
      - signature_verification_mandatory
      - retry_mechanism_respects_attempts_limit
  - action: route_request
    inputs:
      - name: context
        type: RequestContext
    outputs:
      - name: configuration
        type: ProxyConfiguration
    invariants:
      - path_matching_rules_applied
      - configuration_exists_for_route
      - middleware_chain_execution_order_preserved

state_contracts:
  - event: service_status_changed
    state_transitions:
      - from: ACTIVE
        to: INACTIVE
        conditions: [service_unreachable, timeout_exceeded]
      - from: INACTIVE
        to: ACTIVE
        conditions: [service_healthy, retry_success]
      - from: ERROR
        to: ACTIVE
        conditions: [error_resolved, manual_reset]
  - event: webhook_delivery_attempted
    state_transitions:
      - from: ACTIVE
        to: ERROR
        conditions: [delivery_failure, max_retry_attempts_exceeded]
      - from: ERROR
        to: ACTIVE
        conditions: [retry_success, manual_reset]
  - event: configuration_updated
    state_transitions:
      - from: ACTIVE
        to: INACTIVE
        conditions: [configuration_invalidated]
      - from: INACTIVE
        to: ACTIVE
        conditions: [validation_passed]
```