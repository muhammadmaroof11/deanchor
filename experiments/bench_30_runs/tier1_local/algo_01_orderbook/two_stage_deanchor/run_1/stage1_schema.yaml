```yaml
domain_entities:
  OrderBook:
    fields:
      orders: Map<String, LimitOrder>
      _lastOp: Number
      _marketPrice: Number
      bids: OrderSide
      asks: OrderSide
      enableJournaling: Boolean
      stopBook: StopBook

  LimitOrder:
    fields:
      id: String
      side: Side
      size: Number
      price: Number
      accountId: String
      timeInForce: TimeInForce
      postOnly: Boolean
      ocoStopPrice: Number
      type: OrderType

  StopLimitOrder:
    fields:
      id: String
      side: Side
      size: Number
      price: Number
      stopPrice: Number
      stopLimitPrice: Number
      accountId: String
      timeInForce: TimeInForce
      stopLimitTimeInForce: TimeInForce
      postOnly: Boolean
      ocoStopPrice: Number
      type: OrderType

  StopMarketOrder:
    fields:
      id: String
      side: Side
      size: Number
      stopPrice: Number
      accountId: String
      type: OrderType

  OrderSide:
    fields:
      side: Side
      priceTree: Map<Number, OrderQueue>

  OrderQueue:
    fields:
      orders: Array<Order>
      price: Number
      volume: Number

functional_operations:
  createOrder:
    inputs:
      - name: options
        type: CreateOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Valid order type must be provided"
      - "Order ID uniqueness must be enforced for limit orders"

  market:
    inputs:
      - name: options
        type: MarketOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Market price is updated after processing"
      - "Journal log entry is created if journaling enabled"

  limit:
    inputs:
      - name: options
        type: LimitOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Limit order must have valid price and size"
      - "Order ID uniqueness must be enforced"
      - "Time-in-force validation is required"

  stopMarket:
    inputs:
      - name: options
        type: StopMarketOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Stop price must be provided for stop market orders"
      - "Valid side and size are required"

  stopLimit:
    inputs:
      - name: options
        type: StopLimitOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Both stop price and limit price must be provided for stop limit orders"
      - "Time-in-force validation is required"

  oco:
    inputs:
      - name: options
        type: OCOOrderOptions
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "OCO order must have valid stop price and limit price"
      - "Stop order activation logic is implemented"

  processQueue:
    inputs:
      - name: orderQueue
        type: OrderQueue
      - name: quantityToTrade
        type: Number
      - name: takerAccountId
        type: String
      - name: stpMode
        type: SelfTradePreventionMode
    outputs:
      - name: result
        type: IProcessOrder
    invariants:
      - "Self-trade prevention logic is applied"
      - "Partial order handling is implemented"
      - "Market price is updated after processing"

  canFillOrder:
    inputs:
      - name: orderSide
        type: OrderSide
      - name: side
        type: Side
      - name: size
        type: Number
      - name: price
        type: Number
    outputs:
      - name: result
        type: Boolean
    invariants:
      - "Order book volume must be sufficient to fill the order"
      - "Price matching logic is applied based on side"

state_contracts:
  events:
    - name: ORDER_CREATED
      description: An order has been successfully created and added to the book
    - name: ORDER_CANCELLED
      description: An order has been cancelled from the book
    - name: ORDER_EXECUTED
      description: An order has been executed against existing orders in the book
    - name: MARKET_PRICE_UPDATED
      description: The market price has been updated based on executed trades
    - name: JOURNAL_ENTRY_CREATED
      description: A journal entry is created when journaling is enabled

  state_transitions:
    - from: "Empty OrderBook"
      to: "OrderBook with Orders"
      event: "ORDER_CREATED"

    - from: "OrderBook with Active Orders"
      to: "OrderBook with Reduced Orders"
      event: "ORDER_CANCELLED"

    - from: "OrderBook with Matching Orders"
      to: "OrderBook with Executed Orders"
      event: "ORDER_EXECUTED"

    - from: "OrderBook with Existing Orders"
      to: "OrderBook with Updated Market Price"
      event: "MARKET_PRICE_UPDATED"

    - from: "OrderBook with Journaling Enabled"
      to: "OrderBook with Journal Entries"
      event: "JOURNAL_ENTRY_CREATED"
```