```yaml
domain_entities:
  User:
    fields:
      id:
        type: Integer
      username:
        type: String
      email:
        type: String
      password:
        type: String
  Role:
    fields:
      id:
        type: Integer
      name:
        type: String

functional_operations:
  signup:
    action: register_new_user
    inputs:
      username:
        type: String
      email:
        type: String
      password:
        type: String
      roles:
        type: List[String]
    outputs:
      message:
        type: String
    invariants:
      - User must have a unique username and email
      - Password must be securely hashed before storage
      - If no roles provided, default role ID 1 is assigned
      - Roles must exist in the database for assignment

  signin:
    action: authenticate_user
    inputs:
      username:
        type: String
      password:
        type: String
    outputs:
      id:
        type: Integer
      username:
        type: String
      email:
        type: String
      roles:
        type: List[String]
      accessToken:
        type: String
    invariants:
      - User must exist with matching username
      - Provided password must match stored hashed password
      - Access token must be generated using HS256 algorithm
      - Access token must expire in 24 hours
      - Roles must be prefixed with "ROLE_" and capitalized

state_contracts:
  events:
    user_registration:
      description: A new user is created in the system
      triggers:
        - signup operation successful
      preconditions:
        - Username and email are unique
        - Password is properly hashed
      postconditions:
        - User record exists in database
        - Roles are assigned to user (default or specified)
        - Success message returned

    user_authentication:
      description: An existing user's credentials are validated
      triggers:
        - signin operation initiated
      preconditions:
        - User with matching username exists
        - Provided password matches stored hash
      postconditions:
        - Valid access token is generated
        - User profile information is returned
        - Role permissions are properly formatted

  state_transitions:
    user_creation_to_active:
      from: UserCreated
      to: UserActive
      event: user_registration
      constraints:
        - Password must be hashed before transition
        - Roles must be assigned during transition

    user_authentication_success:
      from: UserAuthenticated
      to: SessionEstablished
      event: user_authentication
      constraints:
        - Token generation follows security protocol
        - Role permissions are correctly mapped
```