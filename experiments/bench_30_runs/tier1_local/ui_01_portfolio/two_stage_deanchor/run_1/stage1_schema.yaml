```yaml
domain_entities:
  - name: Portfolio
    fields:
      - name: title
        type: string
      - name: description
        type: string
      - name: author
        type: string
      - name: keywords
        type: list<string>
      - name: favicon
        type: string
      - name: theme
        type: string

  - name: NavigationItem
    fields:
      - name: label
        type: string
      - name: href
        type: string
      - name: order
        type: integer

  - name: Project
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: description
        type: string
      - name: image_url
        type: string
      - name: link
        type: string

  - name: BlogPost
    fields:
      - name: id
        type: string
      - name: title
        type: string
      - name: description
        type: string
      - name: image_url
        type: string
      - name: link
        type: string
      - name: category
        type: string

  - name: ContactForm
    fields:
      - name: name
        type: string
      - name: email
        type: string
      - name: subject
        type: string
      - name: message
        type: string

functional_operations:
  - action: render_portfolio
    inputs: []
    outputs:
      - name: portfolio_data
        type: Portfolio
    invariants:
      - title_must_be_present
      - description_must_be_present
      - author_must_be_present

  - action: navigate_to_section
    inputs:
      - name: section_id
        type: string
    outputs: []
    invariants:
      - valid_section_id_required

  - action: submit_contact_form
    inputs:
      - name: contact_data
        type: ContactForm
    outputs:
      - name: submission_status
        type: boolean
    invariants:
      - all_fields_must_be_filled
      - email_format_validation

  - action: toggle_theme
    inputs: []
    outputs:
      - name: current_theme
        type: string
    invariants:
      - theme_must_be_valid

state_contracts:
  - event: page_load
    state_transitions:
      - from: initial
        to: loaded
      - from: loading
        to: loaded

  - event: navigation_click
    state_transitions:
      - from: active_section
        to: target_section

  - event: form_submission
    state_transitions:
      - from: form_ready
        to: form_submitted
      - from: form_submitted
        to: form_success

  - event: theme_change
    state_transitions:
      - from: light_theme
        to: dark_theme
      - from: dark_theme
        to: light_theme
```