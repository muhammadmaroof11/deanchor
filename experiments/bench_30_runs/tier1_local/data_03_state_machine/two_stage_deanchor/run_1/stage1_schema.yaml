```yaml
domain_entities:
  StateMachine:
    fields:
      current_state:
        type: string
      states:
        type: array
        items:
          type: string
      transitions:
        type: array
        items:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
            event:
              type: string
            condition:
              type: string
  StateTransition:
    fields:
      from_state:
        type: string
      to_state:
        type: string
      trigger_event:
        type: string
      guard_condition:
        type: string
  DataRecord:
    fields:
      id:
        type: string
      data:
        type: object
      metadata:
        type: object
      version:
        type: integer

functional_operations:
  process_transition:
    inputs:
      - state_machine: StateMachine
      - event: string
    outputs:
      - new_state: string
      - success: boolean
    invariants:
      - "transition_must_exist_for_event"
      - "guard_condition_must_evaluate_to_true"
      - "state_change_is_valid"
  validate_transition:
    inputs:
      - state_machine: StateMachine
      - event: string
      - current_state: string
    outputs:
      - is_valid: boolean
      - error_message: string
    invariants:
      - "event_must_be_defined_in_transitions"
      - "from_state_must_match_current_state"
  update_record:
    inputs:
      - record_id: string
      - new_data: object
      - version: integer
    outputs:
      - updated_record: DataRecord
      - success: boolean
    invariants:
      - "record_exists"
      - "version_number_must_be_incremental"
      - "data_integrity_preserved"

state_contracts:
  events:
    - name: "transition_occurred"
      description: "A valid state transition has been processed"
      triggers:
        - process_transition
    - name: "record_updated"
      description: "Data record has been successfully modified"
      triggers:
        - update_record
  state_transitions:
    - from: "initial"
      to: "processing"
      event: "start_processing"
      preconditions:
        - "system_ready"
        - "valid_input_data"
    - from: "processing"
      to: "completed"
      event: "finish_processing"
      preconditions:
        - "data_validated"
        - "no_errors_encountered"
    - from: "completed"
      to: "archived"
      event: "archive_completed"
      preconditions:
        - "finalization_complete"
```