```yaml
domain_entities:
  Developer:
    fields:
      name: String
      title: String
      bio: String
      skills: List<Skill>
      projects: List<Project>
      blogs: List<BlogArticle>
      social_links: List<SocialLink>

  Skill:
    fields:
      name: String
      category: String
      proficiency_level: Optional[String]

  Project:
    fields:
      title: String
      description: String
      banner_url: String
      repository_url: Optional[String]
      live_url: Optional[String]
      tags: List<String>

  BlogArticle:
    fields:
      title: String
      description: String
      url: String
      banner_url: String
      category: String
      published_date: Optional[String]

  ContactMessage:
    fields:
      sender_name: String
      sender_email: String
      subject: String
      message: String
      timestamp: DateTime

  SocialLink:
    fields:
      platform: String
      url: String
      icon: String

functional_operations:
  - action: SubmitContactForm
    inputs:
      - name: String
      - email: String
      - subject: String
      - message: String
    outputs:
      - status: Result<Boolean, Error>
    invariants:
      - "All required fields (name, email, subject, message) must be non-empty strings."
      - "The email field must conform to a valid email address format."
      - "Message delivery must target the configured endpoint securely via POST."

  - action: ToggleTheme
    inputs:
      - current_theme: String
    outputs:
      - new_theme: String
    invariants:
      - "Theme state must strictly alternate between predefined valid themes ('dark', 'light')."

  - action: ScrollToTop
    inputs:
      - current_scroll_position: Float
    outputs:
      - target_scroll_position: Float
    invariants:
      - "Target scroll position must resolve to coordinate 0 (top of document)."

state_contracts:
  - events:
      - name: ThemeSwitched
        payload:
          theme: String
    state_transitions:
      - from: "dark"
        to: "light"
        trigger: "ToggleTheme"
      - from: "light"
        to: "dark"
        trigger: "ToggleTheme"

  - events:
      - name: ContactFormSubmitted
        payload:
          message: ContactMessage
    state_transitions:
      - from: "Idle"
        to: "Submitting"
        trigger: "SubmitContactForm"
      - from: "Submitting"
        to: "Success"
        trigger: "APIResponse200"
      - from: "Submitting"
        to: "Error"
        trigger: "APIResponseError"

  - events:
      - name: ScrollPositionChanged
        payload:
          offset: Float
    state_transitions:
      - from: "Hidden"
        to: "Visible"
        trigger: "ScrollOffset > Threshold"
      - from: "Visible"
        to: "Hidden"
        trigger: "ScrollOffset <= Threshold"
```