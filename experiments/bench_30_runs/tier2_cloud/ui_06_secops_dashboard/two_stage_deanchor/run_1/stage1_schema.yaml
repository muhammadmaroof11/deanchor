```yaml
domain_entities:
  WorkloadNode:
    fields:
      node_identifier: string
      geographic_region: string
      mesh_identity_ip: string
      zero_trust_tunnel_status: enum [Connected, Quarantined, Blocked, L7_Shield_Active]
      threat_classification: enum [Clean, Critical, Warning]
      vulnerability_reference: string
      last_attestation_timestamp: datetime
      action_state: string

  AuditReport:
    fields:
      report_id: string
      total_protected_nodes: integer
      generated_at: datetime
      filter_criteria: string

  QuarantineOrder:
    fields:
      order_id: string
      target_workload_identifier: string
      quarantine_protocol_level: enum [Level_3_Air_Gap, Level_2_Egress_Filtered, Level_1_Read_Only_Mirror]
      justification_ticket_ref: string
      executed_at: datetime
      status: enum [Pending, Executed, Cancelled]

  UserSession:
    fields:
      user_id: string
      username: string
      role: string
      active_cluster_count: integer

functional_operations:
  - action: filter_nodes
    inputs:
      - search_query: string
    outputs:
      - filtered_node_list: list[WorkloadNode]
    invariants:
      - "Search string must match node_identifier, geographic_region, or mesh_identity_ip."

  - action: export_audit_report
    inputs:
      - current_state_filter: string
    outputs:
      - audit_report_artifact: file
    invariants:
      - "Report must capture a point-in-time cryptographic snapshot of all active clusters and nodes."

  - action: inspect_node
    inputs:
      - node_identifier: string
    outputs:
      - node_telemetry_details: WorkloadNode
    invariants:
      - "Target node must exist within the active mesh inventory."

  - action: revoke_key_or_quarantine
    inputs:
      - target_workload_identifier: string
      - quarantine_protocol_level: string
      - justification_ticket_ref: string
    outputs:
      - quarantine_receipt: QuarantineOrder
    invariants:
      - "Justification ticket reference is mandatory for compliance and audit logging."
      - "Execution must immediately terminate active WireGuard mTLS sessions and isolate the node."

state_contracts:
  - events:
      - NodeAttestationReceived
    state_transitions:
      - from: Disconnected
        to: Connected
      - from: Connected
        to: Quarantined
          trigger: "Critical Threat Classification or Revoke Key Action"
      - from: Quarantined
        to: Blocked
          trigger: "Air-gap isolation enforcement complete"

  - events:
      - QuarantineOrderSubmitted
    state_transitions:
      - from: ModalClosed
        to: ModalOpen
          trigger: "User clicks 'Revoke Key' or 'Enforce Quarantine'"
      - from: ModalOpen
        to: OrderExecuted
          trigger: "User confirms isolation order with valid justification reference"
      - from: ModalOpen
        to: ModalClosed
          trigger: "User cancels operation"
```