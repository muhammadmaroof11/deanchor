```yaml
domain_entities:
  OrderBook:
    fields:
      orders: "Map<string, LimitOrder>"
      lastOp: "number"
      marketPrice: "number"
      bids: "OrderSide"
      asks: "OrderSide"
      enableJournaling: "boolean"
      stopBook: "StopBook"

  LimitOrder:
    fields:
      id: "string"
      side: "Side"
      size: "number"
      price: "number"
      accountId: "string"
      timeInForce: "TimeInForce"
      ocoStopPrice: "number"

  OrderQueue:
    fields:
      price: "number"
      volume: "number"
      length: "number"

  OrderSide:
    fields:
      side: "Side"
      volume: "number"
      priceTree: "Tree<number, OrderQueue>"

  ProcessOrderResult:
    fields:
      done: "Array<IOrder>"
      activated: "Array<IOrder>"
      partial: "IOrder"
      partialQuantityProcessed: "number"
      quantityLeft: "number"
      stpExpired: "Array<IOrder>"
      err: "OrderBookError"
      log: "JournalLog"

functional_operations:
  - action: "createOrder"
    inputs:
      - "CreateOrderOptions"
    outputs:
      - "IProcessOrder"
    invariants:
      - "Dispatches to specific order execution handlers based on order type (market, limit, stop_market, stop_limit, oco)."
      - "Returns invalid order type error if order type is unsupported."

  - action: "market"
    inputs:
      - "MarketOrderOptions"
    outputs:
      - "IProcessOrder"
    invariants:
      - "Appends a journal log entry upon successful execution if journaling is enabled."

  - action: "processQueue"
    inputs:
      - "OrderQueue"
      - "number"
      - "string"
      - "SelfTradePreventionMode"
    outputs:
      - "IProcessOrder"
    invariants:
      - "Evaluates Self-Trade Prevention (STP) rules when taker account matches maker account."
      - "STP EXPIRE_MAKER cancels the maker order and continues execution."
      - "STP EXPIRE_TAKER terminates execution, yields STP error, and restores original quantity left."
      - "STP EXPIRE_BOTH cancels maker, terminates execution, and yields STP error."
      - "Handles partial fills by updating maker order size and adjusting queue volume."
      - "Handles full fills by removing maker order from the order book and recording it in 'done'."
      - "Removes linked OCO stop orders from the stop book upon execution."
      - "Updates the order book market price to the executed trade price."

  - action: "canFillOrder"
    inputs:
      - "OrderSide"
      - "Side"
      - "number"
      - "number"
    outputs:
      - "boolean"
    invariants:
      - "Verifies aggregate liquidity volume meets or exceeds requested order size across price levels before matching."

  - action: "validateMarketOrder"
    inputs:
      - "MarketOrderOptions | StopMarketOrderOptions"
    outputs:
      - "IProcessOrder"
    invariants:
      - "Order side must be explicitly SELL or BUY."
      - "Order size must be a strictly positive number."

  - action: "validateLimitOrder"
    inputs:
      - "LimitOrderOptions | StopLimitOrderOptions"
    outputs:
      - "IProcessOrder"
    invariants:
      - "Order side must be explicitly SELL or BUY."
      - "Order ID must not already exist in the order book."
      - "Order size and price must be strictly positive numbers."
      - "TimeInForce must conform to supported domain enums (GTC, FOK, IOC)."

state_contracts:
  - events:
      - "OrderSubmitted"
      - "OrderMatched"
      - "OrderPartiallyFilled"
      - "OrderCanceled"
      - "SelfTradePreventionTriggered"
    state_transitions:
      - from: "Uninitialized"
        to: "SnapshotRestored"
        trigger: "Initialization with Snapshot"
      - from: "SnapshotRestored"
        to: "JournalReplayed"
        trigger: "Initialization with Journal Log"
      - from: "Active"
        to: "PartiallyFilled"
        trigger: "Incoming quantity < Maker order size"
      - from: "Active"
        to: "Filled"
        trigger: "Incoming quantity >= Maker order size"
      - from: "Active"
        to: "Canceled"
        trigger: "Explicit cancellation or STP Maker Expiration"
```