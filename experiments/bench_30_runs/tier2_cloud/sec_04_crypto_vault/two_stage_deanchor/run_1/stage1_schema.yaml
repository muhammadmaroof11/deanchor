```yaml
domain_entities:
  CryptographicKey:
    fields:
      id: string (UUID)
      algorithm: string (e.g., AES-GCM, RSA-OAEP, ECDSA, Ed25519)
      key_ops: list[string] (encrypt, decrypt, sign, verify, deriveKey, deriveBits)
      extractable: boolean
      created_at: timestamp
      expires_at: timestamp (optional)
      status: enum (active, revoked, compromised, expired)

  Vault:
    fields:
      id: string (UUID)
      name: string
      master_key_reference: string (ID reference to wrapping key)
      encrypted_payload: bytes
      version: integer
      updated_at: timestamp

  AccessPolicy:
    fields:
      resource_id: string
      allowed_operations: list[string]
      authentication_requirements: list[string]
      rate_limit: integer (operations per window)

functional_operations:
  - action: GenerateKey
    inputs:
      algorithm_spec: object
      extractable: boolean
      key_ops: list[string]
    outputs:
      key_id: string
      public_parameters: object (if asymmetric)
    invariants:
      - "Private and secret keys must never be exposed in plaintext outside the secure enclave/WebCrypto boundary if marked unextractable."
      - "Key operations must strictly match the permitted operations defined at generation time."

  - action: EncryptVault
    inputs:
      vault_id: string
      plain_data: bytes
      wrapping_key_id: string
    outputs:
      encrypted_payload: bytes
      iv: bytes
      auth_tag: bytes
    invariants:
      - "AEAD (Authenticated Encryption with Associated Data) must be used to ensure both confidentiality and integrity."
      - "Initialization Vectors (IVs) / nonces must be cryptographically random and never reused for the same key."

  - action: DecryptVault
    inputs:
      vault_id: string
      encrypted_payload: bytes
      wrapping_key_id: string
      iv: bytes
      auth_tag: bytes
    outputs:
      plain_data: bytes
    invariants:
      - "Decryption must fail immediately if the authentication tag verification fails, preventing padding oracle or chosen-ciphertext attacks."

  - action: RevokeKey
    inputs:
      key_id: string
    outputs:
      success: boolean
      revocation_timestamp: timestamp
    invariants:
      - "A revoked key must immediately transition to an inactive state, rejecting all subsequent cryptographic operations."

state_contracts:
  events:
    - KeyGenerated
    - KeyRevoked
    - KeyExpired
    - VaultCreated
    - VaultUpdated
    - VaultDecryptionFailed
    - SecurityPolicyViolated

  state_transitions:
    CryptographicKey:
      - from: [Null]
        to: active
        triggered_by: KeyGenerated
      - from: [active]
        to: revoked
        triggered_by: KeyRevoked
      - from: [active]
        to: expired
        triggered_by: KeyExpired

    Vault:
      - from: [Null]
        to: active
        triggered_by: VaultCreated
      - from: [active]
        to: active
        triggered_by: VaultUpdated
```