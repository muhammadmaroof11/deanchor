```yaml
domain_entities:
  User:
    fields:
      id: "UniqueIdentifier"
      username: "String"
      email: "String"
      password: "HashedString"
    relationships:
      roles: "List[Role]"

  Role:
    fields:
      id: "UniqueIdentifier"
      name: "String"

  AuthenticationToken:
    fields:
      token: "String"
      expires_in: "Integer" # 86400 seconds
      algorithm: "String" # HS256

functional_operations:
  - action: "signup"
    inputs:
      username: "String"
      email: "String"
      password: "PlaintextString"
      roles: "List[String] (Optional)"
    outputs:
      success: "Boolean"
      message: "String"
    invariants:
      - "Password must be cryptographically hashed using bcrypt with salt rounds of 8 before persistence."
      - "If specific roles are provided in the input, the user must be associated with the subset of existing roles matching those names."
      - "If no roles are provided, the user must default to the base role identifier (id: 1)."
      - "Persistence failures must result in a system error boundary catch."

  - action: "signin"
    inputs:
      username: "String"
      password: "PlaintextString"
    outputs:
      id: "UniqueIdentifier"
      username: "String"
      email: "String"
      roles: "List[String] (Prefixed with 'ROLE_')"
      accessToken: "String"
    invariants:
      - "Authentication fails if the username does not resolve to an existing User entity."
      - "Authentication fails if the provided plaintext password does not match the stored cryptographic hash via verification."
      - "Upon successful authentication, a JWT must be generated containing the user's identifier, signed with the configured secret, using the HS256 algorithm, with an expiration time of 24 hours."
      - "Associated user roles must be resolved, normalized to uppercase, and prefixed with 'ROLE_' in the output payload."

state_contracts:
  - events:
      - "SIGNUP_INITIATED"
    state_transitions:
      - from: "Unregistered"
        to: "RegisteredWithRoles"
        condition: "User creation succeeds and role assignment completes successfully."

  - events:
      - "SIGNIN_INITIATED"
    state_transitions:
      - from: "Unauthenticated"
        to: "Authenticated"
        condition: "User is found and password verification succeeds, yielding a valid JWT and role set."
```