```yaml
domain_entities:
  - name: Node
    fields:
      id: string
      metadata: map<string, any>
  - name: Edge
    fields:
      id: string
      source_id: string
      target_id: string
      weight: float64
      capacity: float64
      cost: float64
  - name: Graph
    fields:
      nodes: map<string, Node>
      adjacency_list: map<string, list<Edge>>
  - name: Path
    fields:
      node_sequence: list<string>
      total_weight: float64
      total_cost: float64
      is_valid: boolean

functional_operations:
  - action: compute_shortest_route
    inputs:
      graph: Graph
      source_id: string
      target_id: string
      optimization_metric: string # e.g., "weight" or "cost"
    outputs:
      path: Path
    invariants:
      - "The returned path must connect source_id to target_id with the globally minimal cumulative optimization_metric."
      - "If no valid path exists, the output Path.is_valid must be false and node_sequence must be empty."
      - "Negative weight cycles must be detected; if present, execution must abort or return an error state to prevent infinite loops."
      - "Graph topology must remain immutable during the computation."

state_contracts:
  - events:
      - name: PathCalculationRequested
        payload:
          source_id: string
          target_id: string
          optimization_metric: string
      - name: PathCalculationCompleted
        payload:
          path: Path
      - name: PathCalculationFailed
        payload:
          reason: string
    state_transitions:
      - from: Idle
        to: Computing
        on: PathCalculationRequested
      - from: Computing
        to: Completed
        on: PathCalculationCompleted
      - from: Computing
        to: Failed
        on: PathCalculationFailed
      - from: Completed
        to: Idle
        on: Reset
      - from: Failed
        to: Idle
        on: Reset
```