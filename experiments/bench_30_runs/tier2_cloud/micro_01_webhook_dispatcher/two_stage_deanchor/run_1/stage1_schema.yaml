```yaml
domain_entities:
  WebhookEvent:
    fields:
      payload: object
      headers: object
    types:
      payload: JSON
      headers: Map<string, string>

  RouteConfiguration:
    fields:
      path: string
      target_service: string
    types:
      path: string
      target_service: string

  OpenApiSpecification:
    fields:
      spec_definition: object
    types:
      spec_definition: JSON

  HealthStatus:
    fields:
      status: string
      code: integer
    types:
      status: string
      code: integer

functional_operations:
  - action: processWebhook
    inputs:
      - WebhookEvent
    outputs:
      - response: object
    invariants:
      - "Payload must be successfully parsed as JSON."
      - "Incoming requests must satisfy security headers (Helmet)."

  - action: listRoutes
    inputs: []
    outputs:
      - routes: Array<RouteConfiguration>
    invariants:
      - "Must return all active downstream route mappings."

  - action: getOpenApiSpec
    inputs: []
    outputs:
      - spec: OpenApiSpecification
    invariants:
      - "Requests are subject to a rate limit of 60 requests per 1-minute window per IP."

  - action: checkHealth
    inputs: []
    outputs:
      - HealthStatus
    invariants:
      - "Must always return HTTP status 200 and body 'alive' when operational."

state_contracts:
  events:
    - ReceiveWebhookPost
    - RequestRouteListing
    - RequestOpenApiSpec
    - RequestHealthCheck
  state_transitions:
    - from: Idle
      to: WebhookProcessed
      on: ReceiveWebhookPost
    - from: Idle
      to: RoutesListed
      on: RequestRouteListing
    - from: Idle
      to: OpenApiServed
      on: RequestOpenApiSpec
    - from: Idle
      to: HealthChecked
      on: RequestHealthCheck
```