domain_entities:
  - name: HttpRequest
    fields:
      method: string
      path: string
      headers: object
      body: object
  - name: HttpResponse
    fields:
      statusCode: integer
      body: string | object
  - name: GitHubWebhookEvent
    fields:
      payload: object # The specific GitHub event data (e.g., push, pull_request)
      headers: object # GitHub-specific headers (e.g., X-GitHub-Event, X-Hub-Signature)
  - name: APIRoute
    fields:
      method: string
      path: string
      description: string
  - name: ServiceConfiguration
    fields:
      port: integer
      debugMode: boolean
  - name: RateLimitingPolicy
    fields:
      windowDurationMs: integer # Duration of the rate limiting window in milliseconds
      maxRequestsPerWindow: integer # Maximum number of requests allowed within the window
  - name: OpenAPISpecificationDocument
    fields:
      spec: object # The OpenAPI specification in JSON format

functional_operations:
  - name: DispatchGitHubWebhook
    description: Receives and dispatches GitHub webhook events to appropriate downstream services.
    inputs:
      request: HttpRequest (method: "POST", path: "/")
      event: GitHubWebhookEvent (derived from request.body and request.headers)
    outputs:
      response: HttpResponse (statusCode: 200 on success