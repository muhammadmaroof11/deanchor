    text: Create an OCO (One-Cancels-the-Other) order in the order book. See {@link OCOOrderOptions} for details.

  - section: Description of modify function
    text: Modify an existing order in the order book. When an order is modified by price or quantity, it will be deemed as a new entry. Under the price-time-priority algorithm, orders are prioritized according to their order price and order time. Hence, the latest orders will be placed at the back of the matching order queue.

  - section: Description of cancel function
    text: Cancel an existing order from the order book.
